name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
      - name: Verify pinned Node.js
        run: node -e 'const fs = require("node:fs"); const pin = fs.readFileSync("mise.toml", "utf8").match(/node\s*=\s*"([^"]+)"/)[1]; if (process.versions.node !== pin) throw new Error("Node.js version mismatch"); console.log(process.version);'
      - run: npm ci
      - run: npm audit --audit-level=high --registry=https://registry.npmjs.org
      - run: npm run configure:example
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
